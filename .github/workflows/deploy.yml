name: Deploy Ergonet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ergonet-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ssh.nicolapasa.com
      DEPLOY_PORT: '13458'
      DEPLOY_USER: nicolapasacom
      DEPLOY_PATH: /var/www/vhosts/nicolapasa.com/httpdocs
      SSH_PRIVATE_KEY: ${{ secrets.ERGONET_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.ERGONET_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing ERGONET_SSH_PRIVATE_KEY'; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing ERGONET_SSH_KNOWN_HOSTS'; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/ergonet"
          chmod 600 "$HOME/.ssh/ergonet"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Check server prerequisites
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ergonet" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'sh -s' < deploy/preflight.sh
      - name: Upload application
        shell: bash
        run: |
          set -euo pipefail
          export RSYNC_RSH="ssh -i $HOME/.ssh/ergonet -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"
          rsync -rz --exclude='.git/' --exclude='.github/' --exclude='vendor/' --exclude='node_modules/' --exclude='config.ini*' --exclude='.env*' --exclude='auth.json' --exclude='app/runtime/' --exclude='public/images/' --exclude='*.log' ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          # Add repository assets without replacing images already on the server.
          rsync -rz --ignore-existing public/images/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/public/images/"
      - name: Install production dependencies
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ergonet" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'sh -s' < deploy/install.sh
      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/ergonet"
